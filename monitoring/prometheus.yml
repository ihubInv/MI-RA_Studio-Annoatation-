global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mira-backend
    static_configs:
      - targets: ["backend:8000"]

  - job_name: mira-celery
    static_configs:
      - targets: ["celery-worker:5555"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
